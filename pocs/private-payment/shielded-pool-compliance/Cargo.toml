[package]
name = "shielded_pool_compliance"
version = "0.1.0"
authors = ["rymnc <43716372+rymnc@users.noreply.github.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
ark-bn254 = "0.5"
ark-ff = { version = "0.5", features = ["parallel"] }
ark-serialize = "0.5"
num-bigint = "0.4"
light-poseidon = "0.4"
rotortree = { version = "0.17", default-features = false, features = [
    "std",
    "blake3",
    "storage",
    "parallel",
] }
barretenberg-rs = { version = "=5.0.0-nightly.20260324", default-features = false, features = [
    "native",
] }
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
thiserror = "2"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
alloy = { version = "1", features = [
    "providers",
    "signers",
    "contract",
    "sol-types",
    "node-bindings",
    "network",
    "transports",
    "transport-http",
    "rpc-types",
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[features]
default = []
test-mocks = []

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "deny"

[[bin]]
name = "policy-tag"
path = "src/bin/policy_tag.rs"

[[example]]
name = "bench_proving"
path = "examples/bench_proving.rs"

[[example]]
name = "wallet_prove_check"
path = "examples/wallet_prove_check.rs"
