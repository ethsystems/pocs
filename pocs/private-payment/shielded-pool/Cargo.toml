[package]
name = "private-payment-shielded-pool"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib/lib.rs"

[dependencies]
tokio = { version = "1.49", features = ["full", "process"] }
alloy = { version = "1.1", features = ["node-bindings", "sol-types", "essentials"] }
ark-ff = "0.4.2"
ark-bn254 = "0.4"
light-poseidon = "0.2"
zk-kit-lean-imt = "0.1.1"
k256 = { version = "0.14", features = ["ecdh"] }
sealring = { version = "0.3.0", features = ["std", "k256"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
hex = "0.4"
thiserror = "2.0"
rand = "0.10"
tracing = "0.1"

[dev-dependencies]
barretenberg-rs = { version = "=5.0.0-nightly.20260324", default-features = false, features = ["ffi"] }
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tokio-test = "0.4"
tempfile = "3.0"
